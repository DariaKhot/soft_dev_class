<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 7:Earth Fun Facts (Modal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-success-subtle text-center p-5">
<h1 class="text-success mb-4">🌍 Welcome to Planet Earth</h1>
  <!-- Button to trigger modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#earthModal">
    Click to Learn Fun Earth Facts
  </button>
  <!-- Modal -->
  <div class="modal fade" id="earthModal" aria-labelledby="earthModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="earthModalLabel">🌍 Earth Fun Facts</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-start">
          <ul>
            <li><strong>Fact 1:</strong> Earth is the only planet known to support life.</li>
            <li><strong>Fact 2:</strong> 71% of Earth's surface is covered by water.</li>
            <li><strong>Fact 3:</strong> The Earth is about 4.5 billion years old.</li>
          </ul>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
