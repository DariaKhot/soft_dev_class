<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sales Website{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('index') }}">Sales Website</a></h1>
        <nav>
            <a href="{{ url_for('cart') }}">Cart</a> |
            <a href="{{ url_for('register') }}">Sign Up</a> |
            <a href="{{ url_for('login') }}">Login</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer><p>© 2025 Skincare Shop</p></footer>
</body>
</html>
